<div class="calendar"><div class="calendar-heading"><button type="button" (click)="navigate(-1)" [disabled]="offset===0" aria-label="Mes anterior">←</button><h3 aria-live="polite">{{label}}</h3><button type="button" (click)="navigate(1)" [disabled]="offset===5" aria-label="Mes siguiente">→</button></div><div class="calendar-grid"><span class="weekday">L</span><span class="weekday">M</span><span class="weekday">X</span><span class="weekday">J</span><span class="weekday">V</span><span class="weekday">S</span><span class="weekday">D</span>@for(day of days;track $index){@if(day){<button type="button" [disabled]="!allowed(day)" [class.selected]="value()===key(day)" [class.today]="key(day)===todayKey" [attr.aria-pressed]="value()===key(day)" [attr.aria-label]="day+' de '+label" (click)="dateChange.emit(key(day))">{{day}}</button>}@else{<span></span>}}</div><p class="calendar-note"><span></span> Fecha preferida · Sujeta a confirmación</p></div>
